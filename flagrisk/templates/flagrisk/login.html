{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlagRisk - Secure Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        :root {
            --primary-color: #0d9488;
            --primary-hover: #0f766e;
            --accent-color: #f59e0b;
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --surface: rgba(255, 255, 255, 0.8);
            --border: rgba(226, 232, 240, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdfa 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Elements matching index.html vibe */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: rgba(13, 148, 136, 0.2);
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: rgba(59, 130, 246, 0.15);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes move {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(100px, 50px) scale(1.1);
            }
        }

        .login-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 3.5rem;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 35px 70px -12px rgba(0, 0, 0, 0.12);
        }

        .logo-badge {
            width: 56px;
            height: 56px;
            background: rgba(13, 148, 136, 0.1);
            border: 1px solid rgba(13, 148, 136, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .logo-badge i {
            font-size: 1.75rem;
            color: var(--primary-color);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-title {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .brand-tagline {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .form-label {
            font-weight: 600;
            font-size: 0.8125rem;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.025em;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-wrapper i {
            position: absolute;
            left: 1.15rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .form-control-custom {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 3.25rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .form-control-custom:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1);
        }

        .form-control-custom:focus+i {
            color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(13, 148, 136, 0.3);
        }

        .alert-custom {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fda4af;
            border-radius: 12px;
            padding: 0.9rem 1.15rem;
            font-size: 0.875rem;
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .footer-copyright {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div class="login-card animate__animated animate__zoomIn">
        <div class="brand-header">
            <div class="logo-badge">
                <i class="bi bi-flag-fill"></i>
            </div>
            <h1 class="brand-title">FlagRisk</h1>
            <p class="brand-tagline">Supply Chain Risk Management Intelligence</p>
        </div>

        {% if form.errors %}
        <div class="alert-custom animate__animated animate__headShake">
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
            <div>
                <strong>Login Failed</strong><br>
                Please check your credentials.
            </div>
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="mb-4">
                <label class="form-label" for="id_username">Username</label>
                <div class="input-wrapper">
                    <input type="text" name="username" id="id_username" class="form-control-custom"
                        placeholder="Enter username" required autofocus>
                    <i class="bi bi-person-circle"></i>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="id_password">Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" id="id_password" class="form-control-custom"
                        placeholder="Enter password" required>
                    <i class="bi bi-lock-fill"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Sign In to Dashboard</span>
                <i class="bi bi-chevron-right"></i>
            </button>
        </form>

        <div class="footer-copyright">
            &copy; 2026 Iness Solutions. All Rights Reserved.
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
